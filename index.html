<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>혼자 합주실</title>
<meta name="description" content="악기를 하나씩 녹음해 겹쳐 쌓고 믹싱하는 녹음실">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#14181f">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* 배치: 위 막대 · 도구 줄 · (자 + 트랙 머리 | 파형 레인) · 클립 막대 · 녹음기 막대 — 한 화면 앱 */
:root{
  --bg:#eceff3; --surf:#ffffff; --surf2:#f5f6f8; --lane:#f7f8fa; --lane2:#eef1f4;
  --ink:#19202c; --mut:#5c6576; --line:#d2d7df; --grid:rgba(25,32,44,.07); --grid2:rgba(25,32,44,.17);
  --acc:#a8650f; --accSoft:rgba(168,101,15,.13); --accInk:#ffffff;
  --rec:#d23636; --recSoft:rgba(210,54,54,.12); --ok:#2f8a52;
  --head:#ffffff;
  --f-ui:'IBM Plex Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-num:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --f-disp:'Gowun Batang','Nanum Myeongjo',serif;
  --hdrW:116px; --laneH:76px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101318; --surf:#181c24; --surf2:#1e232c; --lane:#151920; --lane2:#1a1f27;
  --ink:#e6eaf1; --mut:#8d96a7; --line:#2a313c; --grid:rgba(230,234,241,.05); --grid2:rgba(230,234,241,.13);
  --acc:#e0a040; --accSoft:rgba(224,160,64,.16); --accInk:#16120a;
  --rec:#f05252; --recSoft:rgba(240,82,82,.15); --ok:#4fbf7b; --head:#14181f;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101318; --surf:#181c24; --surf2:#1e232c; --lane:#151920; --lane2:#1a1f27;
  --ink:#e6eaf1; --mut:#8d96a7; --line:#2a313c; --grid:rgba(230,234,241,.05); --grid2:rgba(230,234,241,.13);
  --acc:#e0a040; --accSoft:rgba(224,160,64,.16); --accInk:#16120a;
  --rec:#f05252; --recSoft:rgba(240,82,82,.15); --ok:#4fbf7b; --head:#14181f;
  color-scheme:dark}
@media (min-width:700px){:root{--hdrW:150px;--laneH:84px}}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.4 var(--f-ui);overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;overflow:hidden}
[hidden]{display:none!important}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

#app{height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.bar{display:flex;align-items:center;gap:8px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}

/* 위 막대 */
.top{background:var(--head);border-bottom:1px solid var(--line);padding-block:6px;min-height:50px}
.proj{display:flex;flex-direction:column;align-items:flex-start;background:none;border:0;padding:2px 4px;min-width:0;border-radius:8px}
.proj .logo{font-family:var(--f-disp);font-weight:700;font-size:17px;letter-spacing:.01em;line-height:1.1}
.proj .pn{font-size:12px;color:var(--mut);max-width:44vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.proj .pn::after{content:" ▾";font-size:10px}
.sp{flex:1}
.ib{width:40px;height:40px;border-radius:10px;border:1px solid transparent;background:none;display:grid;place-items:center;padding:0}
.ib svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ib:disabled{opacity:.35}
.pill{height:38px;padding:0 14px;border-radius:19px;border:1px solid var(--acc);background:var(--acc);color:var(--accInk);font-weight:600}

/* 도구 줄 */
.tools{background:var(--surf);border-bottom:1px solid var(--line);padding-block:6px;overflow-x:auto;scrollbar-width:none;flex-wrap:nowrap}
.tools::-webkit-scrollbar{display:none}
.tg{height:34px;padding:0 11px;border-radius:9px;border:1px solid var(--line);background:var(--surf2);white-space:nowrap;font-size:13px;display:flex;align-items:center;gap:6px}
.tg[aria-pressed="true"]{background:var(--accSoft);border-color:var(--acc);color:var(--ink)}
.tg .dot{width:7px;height:7px;border-radius:50%;background:var(--mut)}
.tg[aria-pressed="true"] .dot{background:var(--acc)}
.tempo{display:flex;align-items:center;height:34px;border:1px solid var(--line);border-radius:9px;background:var(--surf2);flex:none}
.tempo button{width:30px;height:32px;border:0;background:none;font-size:16px}
.tempo .v{font-family:var(--f-num);font-size:14px;min-width:30px;text-align:center}
.tempo small{color:var(--mut);font-size:10px;margin-right:2px}
select.tg{appearance:none;-webkit-appearance:none;padding-right:11px}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;flex:none;margin-left:auto;order:9}
@media (max-width:699px){.seg{order:-1;margin-left:0}}
.seg button{height:32px;padding:0 13px;border:0;background:var(--surf2);font-size:13px}
.seg button[aria-selected="true"]{background:var(--ink);color:var(--surf)}
.vsep{width:1px;height:22px;background:var(--line);flex:none}

/* 트랙 화면 */
main{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
#vTracks{flex:1;min-height:0;display:flex;flex-direction:column}
.rulerRow{display:flex;height:28px;flex:none;background:var(--surf);border-bottom:1px solid var(--line)}
.corner{width:var(--hdrW);flex:none;border-right:1px solid var(--line);font-size:11px;color:var(--mut);display:flex;align-items:center;padding-left:10px;font-family:var(--f-num)}
#cRuler{flex:1;min-width:0;height:28px;touch-action:none;display:block}
.scroller{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;align-items:flex-start;overscroll-behavior:contain}
.hdrs{width:var(--hdrW);flex:none;border-right:1px solid var(--line);background:var(--surf)}
.laneWrap{flex:1;min-width:0;position:relative}
#cLanes{display:block;width:100%;touch-action:pan-y}
.hdr{height:var(--laneH);border-bottom:1px solid var(--line);display:flex;flex-direction:column;justify-content:space-between;padding:7px 7px 7px 11px;position:relative}
.hdr::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--tc)}
.hdr.sel{background:var(--surf2)}
.hdr .nm{border:0;background:none;padding:0;text-align:left;min-width:0;display:flex;flex-direction:column}
.hdr .nm b{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .nm span{font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb{display:flex;gap:4px}
.hb button{height:28px;min-width:28px;flex:1;padding:0 4px;border-radius:7px;border:1px solid var(--line);background:var(--surf2);font-size:11px;font-weight:600}
.hb .arm[aria-pressed="true"]{background:var(--rec);border-color:var(--rec);color:#fff}
.hb .mu[aria-pressed="true"]{background:#c98a14;border-color:#c98a14;color:#fff}
.hb .so[aria-pressed="true"]{background:#2f7fc4;border-color:#2f7fc4;color:#fff}
.addRow{height:56px;display:flex;align-items:center;padding:0 8px}
.addRow button{width:100%;height:38px;border:1px dashed var(--mut);border-radius:9px;background:none;color:var(--mut);font-size:13px}
.empty{position:absolute;left:0;right:0;top:18px;text-align:center;color:var(--mut);font-size:13px;pointer-events:none;padding:0 16px}

/* 믹서 */
#vMixer{flex:1;min-height:0;overflow-x:auto;overflow-y:auto;background:var(--bg)}
.strips{display:flex;gap:8px;padding:10px max(10px,env(safe-area-inset-left,0px));min-height:100%;align-items:stretch}
.strip{width:96px;flex:none;background:var(--surf);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;align-items:stretch;gap:6px;padding:8px 7px;border-top:4px solid var(--tc)}
.strip.master{border-top-color:var(--ink);width:104px}
.strip h4{margin:0;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.knob{display:flex;flex-direction:column;gap:1px}
.knob label{display:flex;justify-content:space-between;font-size:10px;color:var(--mut)}
.knob label output{font-family:var(--f-num);color:var(--ink)}
input[type=range]{width:100%;margin:0;accent-color:var(--acc);height:22px}
.faderBox{flex:1;min-height:130px;display:flex;justify-content:center;gap:6px;align-items:stretch}
.faderBox input{writing-mode:vertical-lr;direction:rtl;width:30px;height:auto;min-height:120px}
.meter{width:8px;border-radius:4px;background:var(--lane2);position:relative;overflow:hidden}
.meter i{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(to top,var(--ok) 0 70%,#d9b400 70% 88%,var(--rec) 88%)}
.db{font-family:var(--f-num);font-size:11px;text-align:center}
.ms{display:flex;gap:4px}
.ms button{flex:1;height:30px;border-radius:7px;border:1px solid var(--line);background:var(--surf2);font-weight:600;font-size:12px}
.ms .mu[aria-pressed="true"]{background:#c98a14;border-color:#c98a14;color:#fff}
.ms .so[aria-pressed="true"]{background:#2f7fc4;border-color:#2f7fc4;color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{height:32px;padding:0 12px;border-radius:16px;border:1px solid var(--line);background:var(--surf2);font-size:13px;display:flex;align-items:center;gap:6px}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--tc)}
.chip[aria-pressed="true"]{border-color:var(--acc);background:var(--accSoft)}

/* 클립 막대 */
.clipbar{background:var(--surf);border-top:1px solid var(--line);padding-block:6px;overflow-x:auto;scrollbar-width:none}
.clipbar::-webkit-scrollbar{display:none}
.clipbar .lbl{font-size:12px;color:var(--mut);white-space:nowrap}
.clipbar button{height:34px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:var(--surf2);font-size:13px;white-space:nowrap;flex:none}
.clipbar .take{font-family:var(--f-num);font-size:12px;min-width:44px;text-align:center}
.clipbar input[type=range]{width:96px;flex:none}
.clipbar button:disabled{opacity:.4}
.clipbar .danger{color:var(--rec)}

/* 녹음기 막대 */
.transport{background:var(--head);border-top:1px solid var(--line);padding-block:8px;min-height:70px}
.clock{display:flex;flex-direction:column;min-width:0;flex:1}
.clock .t{font-family:var(--f-num);font-size:20px;line-height:1.1;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.clock .b{font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbtn{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:var(--surf2);display:grid;place-items:center;flex:none;padding:0}
.tbtn svg{width:22px;height:22px;fill:currentColor}
.tbtn.play{width:54px;height:54px;background:var(--ink);color:var(--surf);border-color:var(--ink)}
.tbtn.rec{width:58px;height:58px;background:var(--surf2);border:2px solid var(--rec)}
.tbtn.rec .dot{width:24px;height:24px;border-radius:50%;background:var(--rec);transition:border-radius .15s,width .15s,height .15s}
.tbtn.rec.on{background:var(--recSoft)}
.tbtn.rec.on .dot{border-radius:4px;width:20px;height:20px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){.tbtn.rec.on .dot{animation:none}}
.tright{flex:1;display:flex;justify-content:flex-end;align-items:center;gap:8px;min-width:0}
.inlv{display:flex;flex-direction:column;align-items:flex-end;gap:3px;font-size:10px;color:var(--mut)}
.inlv .m{width:64px;height:6px;border-radius:3px;background:var(--lane2);overflow:hidden}
.inlv .m i{display:block;height:100%;width:0;background:var(--ok)}
.inlv.hot .m i{background:var(--rec)}
.recInfo{font-size:11px;color:var(--rec);font-weight:600;white-space:nowrap}

/* 시트 */
.scrim{position:fixed;inset:0;background:rgba(8,10,14,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surf);width:100%;max-width:560px;max-height:88%;overflow-y:auto;border-radius:16px 16px 0 0;padding:18px max(18px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px));-webkit-user-select:text;user-select:text}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:16px;max-height:84%}}
.sheet h3{margin:0 0 4px;font-family:var(--f-disp);font-size:20px;text-wrap:balance}
.sheet h5{margin:16px 0 6px;font-size:12px;color:var(--mut);font-weight:600;letter-spacing:.04em}
.sheet p{margin:6px 0;color:var(--mut);font-size:13px;max-width:62ch}
.sheet .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sheet .btn{height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surf2);font-weight:500}
.sheet .btn.pri{background:var(--acc);border-color:var(--acc);color:var(--accInk)}
.sheet .btn.dan{color:var(--rec);border-color:var(--rec);background:none}
.sheet input[type=text],.sheet select{height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surf2);padding:0 12px;width:100%}
.sheet .close{float:right;margin:-6px -6px 0 0}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.list .it{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surf)}
.list .it:last-child{border-bottom:0}
.list .it.cur{background:var(--accSoft)}
.list .it .grow{flex:1;min-width:0;text-align:left;background:none;border:0;padding:0}
.list .it .grow b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list .it .grow small{color:var(--mut);font-size:11px;font-family:var(--f-num)}
.list .it .x{height:32px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:none;font-size:12px}
.note{background:var(--surf2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--ink)}
.note.warn{border-color:var(--acc);background:var(--accSoft)}
.big{font-family:var(--f-num);font-size:28px}

/* 튜너 */
.tuner{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0}
.tuner .nt{font-family:var(--f-disp);font-size:64px;line-height:1}
.tuner .nt sub{font-size:22px;font-family:var(--f-num)}
.tuner .hz{font-family:var(--f-num);font-size:13px;color:var(--mut)}
.gauge{width:100%;max-width:420px;height:46px;position:relative}
.gauge .scale{position:absolute;left:0;right:0;top:20px;height:2px;background:var(--line)}
.gauge .mid{position:absolute;left:50%;top:6px;width:2px;height:30px;margin-left:-1px;background:var(--ok)}
.gauge .ndl{position:absolute;left:50%;top:2px;width:4px;height:38px;margin-left:-2px;border-radius:2px;background:var(--mut);transition:left .08s linear}
.gauge.good .ndl{background:var(--ok)}
.gauge .lab{position:absolute;top:30px;font-size:10px;color:var(--mut);font-family:var(--f-num);transform:translateX(-50%)}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--surf);padding:10px 16px;border-radius:12px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.countBig{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;font-family:var(--f-disp);font-size:120px;color:var(--rec);opacity:.85;z-index:5}

@media (max-height:500px) and (orientation:landscape){:root{--laneH:64px}.top{min-height:42px;padding-block:3px}.transport{min-height:56px;padding-block:4px}.tbtn.rec{width:50px;height:50px}.tbtn.play{width:46px;height:46px}.tbtn{width:42px;height:42px}}
</style>
</head>
<body>
<div id="app">
  <header class="bar top">
    <button class="proj" id="bProj" aria-label="프로젝트 목록"><span class="logo">혼자 합주실</span><span class="pn" id="projName">…</span></button>
    <div class="sp"></div>
    <button class="ib" id="bUndo" title="되돌리기" aria-label="되돌리기" disabled><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
    <button class="ib" id="bSet" title="설정" aria-label="설정"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    <button class="pill" id="bExp">곡 보내기</button>
  </header>

  <div class="bar tools" id="tools">
    <button class="tg" id="bMetro" aria-pressed="true"><span class="dot"></span>메트로놈</button>
    <div class="tempo"><button id="bpmD" aria-label="빠르기 낮추기">−</button><span class="v" id="bpmV">90</span><small>BPM</small><button id="bpmU" aria-label="빠르기 높이기">+</button></div>
    <select class="tg" id="selBeats" aria-label="박자">
      <option value="2">2/4</option><option value="3">3/4</option><option value="4">4/4</option><option value="6">6/8</option>
    </select>
    <button class="tg" id="bCount" aria-pressed="true"><span class="dot"></span>카운트인</button>
    <button class="tg" id="bLoop" aria-pressed="false"><span class="dot"></span>구간 반복</button>
    <select class="tg" id="selRate" aria-label="재생 빠르기"><option value="1">빠르기 100%</option><option value="0.9">90%</option><option value="0.8">80%</option><option value="0.7">70%</option><option value="0.6">60%</option><option value="0.5">50%</option></select>
    <button class="tg" id="bTuner">튜너</button>
    <span class="vsep"></span>
    <button class="tg" id="bZoomO" aria-label="축소">−</button>
    <button class="tg" id="bZoomI" aria-label="확대">+</button>
    <div class="seg" role="tablist">
      <button role="tab" id="tabT" aria-selected="true">트랙</button>
      <button role="tab" id="tabM" aria-selected="false">믹서</button>
    </div>
  </div>

  <main>
    <section id="vTracks">
      <div class="rulerRow"><div class="corner" id="corner">마디</div><canvas id="cRuler"></canvas></div>
      <div class="scroller" id="scroller">
        <div class="hdrs" id="hdrs"></div>
        <div class="laneWrap" id="laneWrap"><canvas id="cLanes"></canvas><div class="empty" id="empty" hidden>빨간 녹음 버튼을 누르면 악기를 고르고 첫 트랙을 녹음합니다.</div></div>
      </div>
    </section>
    <section id="vMixer" hidden><div class="strips" id="strips"></div></section>

  <div class="bar clipbar" id="clipbar" hidden>

    <button id="cbSplit">여기서 나누기</button><button id="cbJoin">옆 구간과 합치기</button>

    <button class="tbtn play" id="bPlay" aria-label="재생"><svg viewBox="0 0 24 24" id="playIco"><path d="M7 4.5v15L20 12z"/></svg></button>

<script>
'use strict';
const VERSION='0.2.0';
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const dbToGain=db=>db<=-59.5?0:Math.pow(10,db/20);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const INST={
  violin:  {name:'바이올린',  color:'#cf8a2c', pan:-0.35, eq:[-3,0,1],  rev:0.28},
  clarinet:{name:'클라리넷',  color:'#3a8db0', pan:0.35,  eq:[-1,1,-1], rev:0.24},
  guitar:  {name:'기타',      color:'#4f9a5a', pan:0,     eq:[0,-1,1],  rev:0.16},
  voice:   {name:'목소리',    color:'#c65a7c', pan:0,     eq:[-3,1,1],  rev:0.22},
  piano:   {name:'피아노',    color:'#7a74c9', pan:0,     eq:[0,0,0],   rev:0.2},
  other:   {name:'다른 악기', color:'#8b8f99', pan:0,     eq:[0,0,0],   rev:0.2},
};
const ROOMS={room:{name:'작은 방',len:0.9,decay:3.2},hall:{name:'연주홀',len:2.2,decay:2.6},church:{name:'성당',len:4,decay:2.2}};

/* ───────── 설정(기기별) ───────── */
const LS='hapju.v1';
let S={lat:null,latAuto:true,dev:'',monitor:0,metroVol:0.7,countBars:1,a4:440,seen:{}};
try{Object.assign(S,JSON.parse(localStorage.getItem(LS)||'{}'))}catch(e){}
function saveS(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}

/* ───────── 저장소(IndexedDB) ───────── */
const idb={db:null,
  open(){return new Promise((res,rej)=>{if(this.db)return res(this.db);const r=indexedDB.open('hapju',1);
    r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('projects',{keyPath:'id'});const b=d.createObjectStore('buffers',{keyPath:'id'});b.createIndex('pid','pid')};
    r.onsuccess=()=>{this.db=r.result;res(this.db)};r.onerror=()=>rej(r.error)})},
  async tx(store,mode,fn){const d=await this.open();return new Promise((res,rej)=>{const t=d.transaction(store,mode);const s=t.objectStore(store);let out;const q=fn(s);if(q)q.onsuccess=()=>{out=q.result};t.oncomplete=()=>res(out);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})},
  put(st,v){return this.tx(st,'readwrite',s=>s.put(v))},
  get(st,k){return this.tx(st,'readonly',s=>s.get(k))},
  all(st){return this.tx(st,'readonly',s=>s.getAll())},
  del(st,k){return this.tx(st,'readwrite',s=>s.delete(k))},
  byPid(pid){return this.tx('buffers','readonly',s=>s.index('pid').getAll(pid))},
  async delPid(pid){const d=await this.open();return new Promise((res,rej)=>{const t=d.transaction('buffers','readwrite');const ix=t.objectStore('buffers').index('pid');const r=ix.openCursor(IDBKeyRange.only(pid));r.onsuccess=()=>{const c=r.result;if(c){c.delete();c.continue()}};t.oncomplete=res;t.onerror=()=>rej(t.error)})}
};

/* ───────── 상태 ───────── */
let P=null;                 // 지금 프로젝트
const BUF=new Map();        // 버퍼 id → {sr,data,peaks,abs}
let undoStack=[];
let selT=null, selClip=false, selS=0, armed=null;
let view={pps:46,x0:0};
let pos=0, playing=false, recording=false, playFrom=0, playT0=0;
let saveTimer=null;

function newProject(name){return{id:uid(),name:name||'새 합주',bpm:90,beats:4,metro:true,countIn:true,tracks:[],master:{vol:0,room:'hall'},loop:{on:false,a:0,b:0},rate:1,created:Date.now(),updated:Date.now(),view:{pps:46,x0:0}}}
function newTrack(inst){const I=INST[inst]||INST.other;const n=P.tracks.filter(t=>t.inst===inst).length;
  return{id:uid(),name:I.name+(n?' '+(n+1):''),inst,vol:-3,pan:I.pan,eq:I.eq.slice(),rev:I.rev,mute:false,solo:false,takes:[],cuts:[],pick:[0]}}
// 0.1 프로젝트(active 하나) → 0.2(나눔 cuts + 구간별 pick)
function migrate(p){for(const t of p.tracks){if(!Array.isArray(t.cuts)){t.cuts=[];t.pick=[t.takes.length?clamp(t.active||0,0,t.takes.length-1):0]}delete t.active}
  if(!p.loop)p.loop={on:false,a:0,b:0};if(!p.rate)p.rate=1;return p}
const trk=id=>P.tracks.find(t=>t.id===id);
// 트랙의 구간: 나눔(cuts)으로 갈린 [a,b) 마다 고른 테이크(pick, -1 = 비움)
function segs(t){const r=[],cs=t.cuts;for(let i=0;i<=cs.length;i++)r.push({i,a:i?cs[i-1]:-Infinity,b:i<cs.length?cs[i]:Infinity,k:t.pick[i],c:t.takes[t.pick[i]]||null});return r}
function segIdx(t){return t&&t.id===selT?clamp(selS,0,t.cuts.length):0}
function segAt(t,x){let i=0;while(i<t.cuts.length&&x>=t.cuts[i])i++;return i}
const takeOf=t=>t?t.takes[t.pick[segIdx(t)]]||null:null;
function clipSpan(c,sg){return[Math.max(c.off+c.ts,sg.a),Math.min(c.off+c.te,sg.b)]}
function projEnd(){let e=0;for(const t of P.tracks)for(const sg of segs(t)){if(!sg.c)continue;const [a,b]=clipSpan(sg.c,sg);if(b>a)e=Math.max(e,b)}return e}
function usedTakes(t){return [...new Set(t.pick)].filter(k=>k>=0&&t.takes[k]).map(k=>t.takes[k])}
function removeTake(t,k){t.takes.splice(k,1);if(!t.takes.length){t.cuts=[];t.pick=[0];return}
  t.pick=t.pick.map(p=>p===k?Math.min(k,t.takes.length-1):p>k?p-1:p)}
// 새 테이크 k 가 걸친 구간은 그 테이크로
function useNewTake(t,k){const c=t.takes[k],r0=c.off+c.ts,r1=c.off+c.te,sg=segs(t);
  t.pick=t.pick.map((p,i)=>(sg[i].b>r0&&sg[i].a<r1)||!t.takes[p]?k:p);selT=t.id;selClip=true;selS=segAt(t,r0+0.001)}

function touch(){P.updated=Date.now();clearTimeout(saveTimer);saveTimer=setTimeout(saveProject,600)}
async function saveProject(){if(!P)return;P.view={pps:view.pps,x0:view.x0};try{await idb.put('projects',JSON.parse(JSON.stringify(P)))}catch(e){toast('저장하지 못했습니다: '+e.message)}}
function pushUndo(){undoStack.push(JSON.stringify({tracks:P.tracks,bpm:P.bpm,beats:P.beats,master:P.master,loop:P.loop}));if(undoStack.length>60)undoStack.shift();$('#bUndo').disabled=false}
function undo(){if(!undoStack.length||recording)return;const s=JSON.parse(undoStack.pop());const was=playing;if(was)stopPlay();Object.assign(P,s);if(!trk(selT))selT=null;if(!trk(armed))armed=null;syncChains();renderAll();touch();$('#bUndo').disabled=!undoStack.length;toast('되돌렸습니다')}

/* ───────── 오디오 엔진 ───────── */
let ac=null, M=null; const CH=new Map(); let srcs=[];
function ensureAC(){
  if(!ac){ac=new (window.AudioContext||window.webkitAudioContext)({latencyHint:'interactive'});M=makeMaster(ac);syncChains()}
  if(ac.state!=='running')ac.resume();
  return ac;
}
function makeIR(ctx,room){const R=ROOMS[room]||ROOMS.hall;const sr=ctx.sampleRate;const n=Math.floor(R.len*sr);const b=ctx.createBuffer(2,n,sr);
  for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch);let lp=0;let seed=ch?1234567:7654321;
    for(let i=0;i<n;i++){seed=(seed*1103515245+12345)&0x7fffffff;const w=seed/0x3fffffff-1;const t=i/n;const k=0.25+0.7*t;lp=lp+(w-lp)*(1-k*0.9);
      const pre=i<sr*0.012?0:1;d[i]=lp*Math.pow(1-t,R.decay)*pre*0.6}}
  return b}
function makeMaster(ctx){const m={};m.in=ctx.createGain();m.lim=ctx.createDynamicsCompressor();
  m.lim.threshold.value=-4;m.lim.knee.value=2;m.lim.ratio.value=16;m.lim.attack.value=0.003;m.lim.release.value=0.15;
  m.an=ctx.createAnalyser();m.an.fftSize=1024;m.conv=ctx.createConvolver();m.conv.buffer=makeIR(ctx,P?P.master.room:'hall');m.room=P?P.master.room:'hall';
  m.in.connect(m.lim);m.lim.connect(m.an);m.lim.connect(ctx.destination);m.conv.connect(m.in);m.in.gain.value=dbToGain(P?P.master.vol:0);return m}
function makeChain(ctx,m,t){const c={};
  c.in=ctx.createGain();c.hp=ctx.createBiquadFilter();c.hp.type='highpass';c.hp.frequency.value=60;c.hp.Q.value=0.6;
  c.lo=ctx.createBiquadFilter();c.lo.type='lowshelf';c.lo.frequency.value=200;
  c.mid=ctx.createBiquadFilter();c.mid.type='peaking';c.mid.frequency.value=1100;c.mid.Q.value=0.8;
  c.hi=ctx.createBiquadFilter();c.hi.type='highshelf';c.hi.frequency.value=4500;
  c.fad=ctx.createGain();c.pan=ctx.createStereoPanner();c.send=ctx.createGain();c.an=ctx.createAnalyser();c.an.fftSize=256;
  c.in.connect(c.hp);c.hp.connect(c.lo);c.lo.connect(c.mid);c.mid.connect(c.hi);c.hi.connect(c.fad);c.fad.connect(c.pan);c.pan.connect(m.in);c.fad.connect(c.send);c.send.connect(m.conv);c.fad.connect(c.an);
  applyChain(ctx,c,t,true);return c}
function effGain(t,forRec){const anySolo=P.tracks.some(x=>x.solo);let g=dbToGain(t.vol);if(t.mute||(anySolo&&!t.solo))g=0;if(forRec&&recording&&t.id===recTrackId)g=0;return g}
function applyChain(ctx,c,t,now){const T=ctx.currentTime;const set=(p,v)=>{if(now){p.value=v}else{p.setTargetAtTime(v,T,0.02)}};
  set(c.lo.gain,t.eq[0]);set(c.mid.gain,t.eq[1]);set(c.hi.gain,t.eq[2]);set(c.fad.gain,effGain(t,true));set(c.pan.pan,t.pan);set(c.send.gain,t.rev)}
function syncChains(){if(!ac)return;for(const [id,c] of CH){if(!trk(id)){try{c.pan.disconnect();c.send.disconnect()}catch(e){}CH.delete(id)}}
  for(const t of P.tracks){let c=CH.get(t.id);if(!c){c=makeChain(ac,M,t);CH.set(t.id,c)}else applyChain(ac,c,t,false)}
  if(M.room!==P.master.room){M.conv.buffer=makeIR(ac,P.master.room);M.room=P.master.room}
  M.in.gain.setTargetAtTime(dbToGain(P.master.vol),ac.currentTime,0.02)}
// 느리게 연습: 음높이는 두고 길이만 늘림(WSOLA)
async function stretch(x,rate,yieldy){const N=2048,Hs=N/2,Ha=Hs*rate,tol=256,L=Hs;
  const outLen=Math.ceil(x.length/rate);const y=new Float32Array(outLen+N);const w=new Float32Array(N);for(let i=0;i<N;i++)w[i]=0.5-0.5*Math.cos(2*Math.PI*i/N);
  let ip=0,nat=Hs;const frames=Math.ceil(outLen/Hs)+1;
  for(let k=0;k<frames;k++){const op=k*Hs;
    if(k>0){const tg=Math.round(k*Ha);let best=0;
      if(nat+L<x.length){let bv=-Infinity;for(let d=-tol;d<=tol;d+=4){const st=tg+d;if(st<0||st+L>=x.length)continue;let v=0;for(let j=0;j<L;j+=8)v+=x[nat+j]*x[st+j];if(v>bv){bv=v;best=d}}}
      ip=Math.max(0,tg+best)}
    for(let i=0;i<N;i++){const si=ip+i,o=op+i;if(si>=x.length||o>=y.length)break;y[o]+=x[si]*w[i]}
    nat=ip+Hs;
    if(yieldy&&k%400===399)await new Promise(r=>setTimeout(r,0))}
  return y.slice(0,outLen)}
const stCache=new Map(); // 'id@rate' → 늘인 소리
async function prepareRate(rate){if(rate>=0.999)return;const need=new Set();
  for(const t of P.tracks)for(const c of usedTakes(t))if(BUF.get(c.buf)&&!stCache.has(c.buf+'@'+rate))need.add(c.buf);
  if(!need.size)return;toast('느리게 들을 준비 중… (소리 '+need.size+'개)',30000);
  for(const id of need){const b=BUF.get(id);stCache.set(id+'@'+rate,await stretch(b.data,rate,true))}
  toast('준비 완료',900)}
function abFor(ctx,id,rate){rate=rate||1;const b=BUF.get(id);if(!b)return null;const key=rate>=0.999?'1':String(rate);
  if(ctx===ac){b.abs=b.abs||{};if(b.abs[key])return b.abs[key]}
  const d=key==='1'?b.data:stCache.get(id+'@'+rate);if(!d)return null;
  const ab=ctx.createBuffer(1,d.length,b.sr);ab.copyToChannel(d,0);if(ctx===ac)b.abs[key]=ab;return ab}
// 클립 c 를 트랙 구간 [lo,hi) · 재생 구간 [from,to) 안에서, ctx 시각 t0(=타임라인 from)부터 rate 빠르기로 예약
const XF=0.012; // 나눔 경계를 겹쳐 잇는 길이
function schedClip(ctx,chainIn,c,t0,from,to,rate,lo,hi,list){
  const rs=c.off+c.ts,re=c.off+c.te;
  const ca=isFinite(lo)?lo-XF/2:-Infinity,cb=isFinite(hi)?hi+XF/2:Infinity;
  const s0=Math.max(rs,ca,from),e0=Math.min(re,cb,to);if(e0<=s0+0.002)return;
  const ab=abFor(ctx,c.buf,rate);if(!ab)return;
  const G=dbToGain(c.gain||0),fi=Math.max(0.004,c.fi),fo=Math.max(0.004,c.fo);
  const env=x=>{let v=Math.min(1,clamp((x-rs)/fi,0,1),clamp((re-x)/fo,0,1));
    if(isFinite(ca))v=Math.min(v,clamp((x-ca)/XF,0,1));if(isFinite(cb))v=Math.min(v,clamp((cb-x)/XF,0,1));
    if(isFinite(to))v=Math.min(v,clamp((to-x)/0.004,0,1));if(from>rs+0.001&&from>ca)v=Math.min(v,clamp((x-from)/0.004,0,1));
    return G*v};
  const T=x=>t0+(x-from)/rate;
  const g=ctx.createGain();g.gain.setValueAtTime(env(s0),T(s0));
  const pts=[rs+fi,re-fo,ca+XF,cb-XF,to-0.004,from+0.004,e0].filter(p=>isFinite(p)&&p>s0&&p<=e0).sort((a,b)=>a-b);
  for(const p of pts)g.gain.linearRampToValueAtTime(env(p),T(p));
  const s=ctx.createBufferSource();s.buffer=ab;s.connect(g);g.connect(chainIn);
  s.start(T(s0),Math.max(0,(c.ts+(s0-rs))/rate),(e0-s0)/rate);
  if(list){list.push(s);s.onended=()=>{const i=list.indexOf(s);if(i>=0)list.splice(i,1);try{g.disconnect()}catch(e){}}}}

function latency(){if(S.lat!=null)return S.lat/1000;if(!ac)return 0.12;return (ac.baseLatency||0.01)+(ac.outputLatency||0.04)+0.03}

/* 메트로놈 */
function clickAt(t,acc,vol){const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=acc?1760:1180;o.type='sine';
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime((acc?0.9:0.6)*vol,t+0.002);g.gain.exponentialRampToValueAtTime(0.0001,t+0.05);
  o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+0.06)}
function showCount(k,t){const ms=Math.max(0,(t-ac.currentTime)*1000);setTimeout(()=>{const el=$('#countBig');if(!recording&&!playing)return;el.hidden=false;el.textContent=k;clearTimeout(showCount.h);showCount.h=setTimeout(()=>el.hidden=true,Math.min(400,60/P.bpm*900))},ms)}

/* 재생: 반복 구간이면 회차(seg)마다 이어서 예약 */
let PL=null;
function startPlay(from,t0,countBeats,rate){ensureAC();syncChains();stopSources();
  rate=rate||1;const L=P.loop;const lp=L.on&&L.b>L.a+0.05?{a:L.a,b:L.b}:null;
  if(lp&&(from<lp.a-1e-6||from>=lp.b-0.02))from=lp.a;
  playFrom=from;playT0=t0;
  PL={t0,rate,lp,segs:[{t:t0,from,to:lp?lp.b:Infinity,sch:false}],mi:0,mn:Math.ceil(from/(60/P.bpm)-1e-6)};
  const cb=countBeats||0,spbC=60/P.bpm/rate;
  for(let k=cb;k>=1;k--){const t=t0-k*spbC;clickAt(Math.max(t,ac.currentTime),(cb-k)%P.beats===0,S.metroVol);showCount(k,t)}
  clearInterval(startPlay.iv);startPlay.iv=setInterval(playTick,25);playing=true;playTick();updTransport()}
function playTick(){if(!PL)return;const now=ac.currentTime,ahead=now+0.5;let s=PL.segs[PL.segs.length-1];
  while(PL.lp&&s.t+(s.to-s.from)/PL.rate<ahead){s={t:s.t+(s.to-s.from)/PL.rate,from:PL.lp.a,to:PL.lp.b,sch:false};PL.segs.push(s)}
  for(const sg of PL.segs){if(sg.sch||sg.t>ahead)continue;sg.sch=true;
    for(const t of P.tracks){const ch=CH.get(t.id);if(!ch)continue;for(const q of segs(t))if(q.c)schedClip(ac,ch.in,q.c,sg.t,sg.from,sg.to,PL.rate,q.a,q.b,srcs)}}
  const spb=60/P.bpm,ah=now+0.18;
  for(let guard=0;guard<64;guard++){const sg=PL.segs[PL.mi];if(!sg)break;const x=PL.mn*spb;
    if(x>=sg.to-1e-6){const nx=PL.segs[PL.mi+1];if(!nx)break;PL.mi++;PL.mn=Math.ceil(nx.from/spb-1e-6);continue}
    const t=sg.t+(x-sg.from)/PL.rate;if(t>ah)break;
    if(P.metro)clickAt(Math.max(t,now),((PL.mn%P.beats)+P.beats)%P.beats===0,S.metroVol);PL.mn++}
  while(PL.segs.length>3&&PL.mi>1&&PL.segs[0].sch&&PL.segs[0].t+(PL.segs[0].to-PL.segs[0].from)/PL.rate<now-1){PL.segs.shift();PL.mi--}}
function stopSources(){for(const s of srcs.slice()){try{s.onended=null;s.stop()}catch(e){}}srcs=[]}
function stopPlay(keep){stopSources();clearInterval(startPlay.iv);PL=null;playing=false;$('#countBig').hidden=true;if(!keep)pos=playFrom;updTransport();dirty=true}
function curTime(){if(!playing||!PL)return pos;const e=ac.currentTime-(ac.outputLatency||0);let sg=PL.segs[0];for(const q of PL.segs){if(q.t<=e)sg=q;else break}
  return Math.min(sg.from+(e-sg.t)*PL.rate,sg.to)}
async function togglePlay(){if(recording){stopRec();return}if(playing){stopPlay();return}ensureAC();const r=P.rate||1;if(r<1)await prepareRate(r);if(playing||recording)return;startPlay(pos,ac.currentTime+0.06,0,r)}

/* ───────── 마이크 ───────── */
let mic=null; // {stream,src,node,an,mon}
const WK=`class R extends AudioWorkletProcessor{constructor(){super();this.on=false;this.b=new Float32Array(8192);this.n=0;this.f0=0;this.pk=0;this.pc=0;

let inPeak=0,recChunks=[],recDone=null,livePeaks=null;
async function ensureMic(){ensureAC();if(mic&&mic.stream.active)return mic;

  try{
    const cons={echoCancellation:false,noiseSuppression:false,autoGainControl:false,channelCount:1};
    if(S.dev)cons.deviceId={exact:S.dev};
    let stream;
    try{stream=await navigator.mediaDevices.getUserMedia({audio:cons})}catch(e){if(S.dev&&e.name==='OverconstrainedError'){S.dev='';saveS();delete cons.deviceId;stream=await navigator.mediaDevices.getUserMedia({audio:cons})}else throw e}
    if(!ensureMic.wk){const url=URL.createObjectURL(new Blob([WK],{type:'application/javascript'}));await ac.audioWorklet.addModule(url);ensureMic.wk=1}
    const src=ac.createMediaStreamSource(stream);const node=new AudioWorkletNode(ac,'rec',{numberOfInputs:1,numberOfOutputs:1,channelCount:1,channelCountMode:'explicit'});

    its.forEach(it=>{const dur=it.to-it.from,got=Math.min(tStop,it.t+dur)-it.t;if(its.length>1&&got<Math.min(1,dur*0.5))return;
      const s0=Math.max(0,Math.floor((it.t-mg+lat)*sr)-f0),e0=Math.min(len,Math.ceil((it.t+dur+mg+lat)*sr)-f0);if(e0-s0<sr*0.25)return;

  if(y<top+16)for(let j=0;j<t.cuts.length;j++){if(Math.abs((t.cuts[j]-view.x0)*pps-x)<14)return{t,mode:'cut',j}}
  const s=segAt(t,tm),sg=segs(t)[s],c=sg.c;if(!c)return{t,s};
  const rs=c.off+c.ts,re=c.off+c.te,[vs,ve]=clipSpan(c,sg),xl=(vs-view.x0)*pps,xr=(ve-view.x0)*pps;
  if(t.id===selT&&selClip&&s===segIdx(t)){const lE=rs>=sg.a,rE=re<=sg.b;const fx=xl+Math.max(c.fi*pps,8),gx=xr-Math.max(c.fo*pps,8);
    if(y<top+20){if(lE&&Math.abs(x-fx)<16)return{t,s,c,mode:'fi'};if(rE&&Math.abs(x-gx)<16)return{t,s,c,mode:'fo'}}
    if(lE&&Math.abs(x-xl)<16)return{t,s,c,mode:'tl'};if(rE&&Math.abs(x-xr)<16)return{t,s,c,mode:'tr'}}

  if(ptr.size===2){const [a,b]=[...ptr.values()];drag={mode:'pinch',d:Math.hypot(a.x-b.x,a.y-b.y),mx:(a.x+b.x)/2,pps:view.pps,x0:view.x0};return}
  if(ptr.size>2)return;
  const h=hit(p.x,p.y);drag={sx:p.x,sy:p.y,moved:false,h,x0:view.x0,mode:h&&h.mode?h.mode:'pan',orig:h&&h.c?{...h.c}:null,oc:h&&h.t?h.t.cuts.slice():null,undo:false};

  const dx=p.x-drag.sx;if(!drag.moved&&Math.abs(dx)<7&&Math.abs(p.y-drag.sy)<7)return;
  if(!drag.moved){drag.moved=true;const h=drag.h;if(drag.mode==='mv'&&!(h.t.id===selT&&selClip&&h.s===segIdx(h.t))){selT=h.t.id;selS=h.s;selClip=true;renderHeaders();renderClipbar()}}
  const pps=view.pps,dt=dx/pps;
  if(drag.mode==='pan'){view.x0=Math.max(0,drag.x0-dt);dirty=true;return}

  else if(drag.mode==='tr'){const b=BUF.get(c.buf);c.te=clamp(o.te+dt,o.ts+0.05,b?b.data.length/b.sr:o.te);c.fo=Math.min(c.fo,(c.te-c.ts)/2)}

/* 소리 정리: 음량 맞추기(클립 크기만) · 잡음 줄이기(새 소리로 바꿈, 되돌리기 가능) */
function analyze(d,sr,i0,i1){const W=Math.max(1,Math.floor(sr*0.05));const rms=[];let pk=0;
  for(let i=i0;i<i1;i+=W){let s2=0;const e=Math.min(i1,i+W);for(let j=i;j<e;j++){const v=d[j];s2+=v*v;const a=v<0?-v:v;if(a>pk)pk=a}rms.push(Math.sqrt(s2/Math.max(1,e-i)))}
  const so=rms.slice().sort((a,b)=>a-b);const floor=so[Math.floor(so.length*0.1)]||0,top=so[Math.floor(so.length*0.95)]||0;
  const th=Math.max(floor*3,top*0.08);let ss=0,n=0;for(const r of rms)if(r>th){ss+=r*r;n++}return{pk,floor,top,th,act:n?Math.sqrt(ss/n):top}}
function autoGainDb(c){const b=BUF.get(c.buf);if(!b)return c.gain||0;const i0=Math.floor(c.ts*b.sr),i1=Math.min(b.data.length,Math.floor(c.te*b.sr));if(i1-i0<b.sr*0.2)return c.gain||0;
  const a=analyze(b.data,b.sr,i0,i1);if(a.act<1e-5)return c.gain||0;
  let db=20*Math.log10(0.1/a.act);db=Math.min(db,20*Math.log10(0.89/Math.max(a.pk,1e-6)));return clamp(Math.round(db*2)/2,-24,18)}
function autoLevelAll(){const list=[];for(const t of P.tracks)for(const c of usedTakes(t))list.push(c);if(!list.length){toast('맞출 녹음이 없습니다');return}
  pushUndo();for(const c of list)c.gain=autoGainDb(c);renderAll();touch();toast('테이크 '+list.length+'개의 음량을 맞췄습니다. 악기 사이 크기는 믹서 페이더로 조절하세요',3800)}
function hpf(d,sr,fc){const K=Math.tan(Math.PI*fc/sr),Q=Math.SQRT1_2,n=1/(1+K/Q+K*K);const b0=n,b1=-2*n,b2=n,a1=2*(K*K-1)*n,a2=(1-K/Q+K*K)*n;
  const y=new Float32Array(d.length);let x1=0,x2=0,y1=0,y2=0;for(let i=0;i<d.length;i++){const x=d[i];const v=b0*x+b1*x1+b2*x2-a1*y1-a2*y2;x2=x1;x1=x;y2=y1;y1=v;y[i]=v}return y}
function denoise(d,sr,strength){const y=hpf(d,sr,90);const a=analyze(y,sr,0,y.length);const th=a.th*0.8;if(th<1e-6)return y;
  const ga=Math.exp(-1/(sr*0.002)),gr=Math.exp(-1/(sr*0.03)),op=Math.exp(-1/(sr*0.003)),cl=Math.exp(-1/(sr*0.06)),H=Math.floor(sr*0.05),gmin=Math.pow(10,-strength/20);
  let env=0,g=1,hold=0;
  for(let i=0;i<y.length;i++){const v=y[i]<0?-y[i]:y[i];env=v>env?ga*env+(1-ga)*v:gr*env+(1-gr)*v;let tg;
    if(env>=th){tg=1;hold=H}else if(hold>0){hold--;tg=1}else tg=Math.max(gmin,(env/th)*(env/th));
    g=tg>g?op*g+(1-op)*tg:cl*g+(1-cl)*tg;y[i]*=g}
  return y}
function cleanSheet(){const t=trk(selT),c=takeOf(t);if(!c)return;if(playing)stopPlay(true);const k=t.pick[segIdx(t)];const sug=autoGainDb(c);
  openSheet(`<h3>소리 정리</h3><p>${esc(t.name)} · 테이크 ${k+1}</p>
  <h5>음량 맞추기</h5><p>연주하는 부분의 크기를 재서 알맞게 맞춥니다. 녹음 원본은 그대로 두고 클립 크기만 바꿉니다.</p>
  <div class="row"><button class="btn pri" id="clG">이 테이크 맞추기 (${fDb(c.gain||0)} → ${fDb(sug)}dB)</button><button class="btn" id="clGA">모든 트랙 맞추기</button></div>
  <h5>잡음 줄이기</h5><p>웅웅거리는 낮은 소리를 걸러 내고, 연주를 쉬는 동안 들리는 배경 소음을 줄입니다. 연주와 함께 섞인 잡음은 거의 그대로 남습니다.</p>
  <div class="row"><button class="btn" data-nr="12">약하게</button><button class="btn" data-nr="24">강하게</button></div>
  <p>마음에 안 들면 되돌리기(↶)로 원래대로 돌릴 수 있습니다.</p><div id="clOut"></div>`);
  $('#clG').onclick=()=>{pushUndo();c.gain=sug;renderAll();touch();closeSheet();toast('음량을 '+fDb(sug)+'dB로 맞췄습니다')};
  $('#clGA').onclick=()=>{closeSheet();autoLevelAll()};
  $('#sheet').querySelectorAll('[data-nr]').forEach(b=>b.onclick=async()=>{const st=+b.dataset.nr;$('#clOut').innerHTML='<span class="note">정리하는 중…</span>';await new Promise(r=>setTimeout(r,30));
    const src=BUF.get(c.buf);if(!src){closeSheet();return}const y=denoise(src.data,src.sr,st);const id=uid();await addBuffer(id,src.sr,y);
    pushUndo();c.buf=id;dirty=true;touch();closeSheet();toast('잡음을 줄였습니다 ('+(st===12?'약하게':'강하게')+'). ▶ 로 들어 보세요',3000)})}

async function importFile(t,f){ensureAC();toast('불러오는 중…',8000);
  try{const ab=await ac.decodeAudioData(await f.arrayBuffer());const n=ab.length,d=new Float32Array(n);
    for(let ch=0;ch<ab.numberOfChannels;ch++){const s=ab.getChannelData(ch);for(let i=0;i<n;i++)d[i]+=s[i]/ab.numberOfChannels}
    const id=uid();await addBuffer(id,ab.sampleRate,d);pushUndo();
    t.takes.push({buf:id,off:pos,ts:0,te:n/ab.sampleRate,fi:0.01,fo:0.03,gain:0,at:0});useNewTake(t,t.takes.length-1);renderAll();touch();toast("'"+f.name+"'을(를) 불러왔습니다. 끌어서 위치를 맞추세요",3500)}
  catch(e){toast('이 파일은 읽을 수 없습니다: '+(e.message||e.name),4000)}}

const NOTES=['도','도♯','레','레♯','미','파','파♯','솔','솔♯','라','라♯','시'];
const NOTES_EN=['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];
const STRINGS={violin:{name:'바이올린',s:[55,62,69,76]},guitar:{name:'기타',s:[40,45,50,55,59,64]},clarinet:{name:'클라리넷(B♭)',s:[],tr:2}};
function autoCorr(buf,sr){let n=buf.length,rms=0;for(let i=0;i<n;i++)rms+=buf[i]*buf[i];rms=Math.sqrt(rms/n);if(rms<0.008)return -1;
  let r1=0,r2=n-1;const th=0.2;for(let i=0;i<n/2;i++)if(Math.abs(buf[i])<th){r1=i;break}for(let i=1;i<n/2;i++)if(Math.abs(buf[n-i])<th){r2=n-i;break}
  const b=buf.slice(r1,r2);n=b.length;const c=new Float32Array(n);for(let i=0;i<n;i++){let s=0;for(let j=0;j<n-i;j++)s+=b[j]*b[j+i];c[i]=s}

$('#selBeats').onchange=e=>{pushUndo();P.beats=+e.target.value;dirty=true;touch()};
$('#bZoomI').onclick=()=>zoom(1.5);$('#bZoomO').onclick=()=>zoom(1/1.5);
function setTab(m){$('#tabT').setAttribute('aria-selected',!m);$('#tabM').setAttribute('aria-selected',m);$('#vTracks').hidden=m;$('#vMixer').hidden=!m;if(m)renderMixer();renderClipbar();dirty=true}
$('#tabT').onclick=()=>setTab(false);$('#tabM').onclick=()=>setTab(true);
document.addEventListener('keydown',e=>{if(e.target.matches('input[type=text],select'))return;if(!$('#scrim').hidden){if(e.key==='Escape')closeSheet();return}
  if(e.code==='Space'){e.preventDefault();togglePlay()}else if(e.key==='l'||e.key==='L'){$('#bLoop').click()}else if(e.key==='r'||e.key==='R'){recording?stopRec():startRec()}else if((e.ctrlKey||e.metaKey)&&e.key==='z'){e.preventDefault();undo()}else if(e.key==='Home'){$('#bHome').click()}});
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(recording)stopRec();else{if(playing)stopPlay();closeMic()}saveProject()}});
window.addEventListener('pagehide',()=>saveProject());
new ResizeObserver(()=>{dirty=true}).observe($('#laneWrap'));
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',readColors);
window.addEventListener('resize',readColors);

async function boot(){readColors();
  try{await idb.open()}catch(e){toast('이 브라우저에서는 저장이 되지 않습니다',4000)}
  let p=null;try{const last=localStorage.getItem('hapju.last');if(last)p=await idb.get('projects',last);if(!p){const all=await idb.all('projects');if(all.length)p=all.sort((a,b)=>b.updated-a.updated)[0]}}catch(e){}
  if(!p){const d=demoProject();try{for(const b of d.bufs)await idb.put('buffers',b);await idb.put('projects',d.p)}catch(e){}
    if(!S.seen.demo){S.seen.demo=1;saveS();setTimeout(()=>toast('예시 곡이 들어 있습니다. ▶ 을 눌러 들어 보고, 믹서에서 바꿔 보세요',4500),600)}
    p=d.p;await openProject(p,false);if(!BUF.size)for(const b of d.bufs)BUF.set(b.id,{sr:b.sr,data:b.data,peaks:mkPeaks(b.data)});dirty=true}
  else await openProject(p);
  requestAnimationFrame(frame);
  if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{})}
boot();
</script>
</body>
</html>
